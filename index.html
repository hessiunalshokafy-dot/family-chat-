<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شات العيلة</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4d45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3efe6;--ink:#1d2b28;--pine:#1f4d45;--mine:#1f4d45;--mine-ink:#f3efe6;--other:#fff;--muted:#6b7a76;--line:#ddd6c6;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121a18;--ink:#e8efec;--pine:#0f2b26;--mine:#2f7a6b;--mine-ink:#fff;--other:#1e2a27;--muted:#8fa19b;--line:#2a3835}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
.hidden{display:none!important}
#auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:auto}
#auth h1{font-size:34px;margin:0 0 6px}
#auth p{color:var(--muted);margin:0 0 24px}
input,button{font:inherit}
input[type=text],input[type=email],input[type=password],#txt{width:100%;padding:14px;margin-bottom:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--other);color:var(--ink)}
input:focus{outline:2px solid var(--mine);border-color:transparent}
button{border:0;border-radius:12px;cursor:pointer}
#go{width:100%;padding:14px;background:var(--mine);color:var(--mine-ink);font-weight:700}
#switch{background:none;color:var(--muted);width:100%;padding:14px;text-decoration:underline}
#err{color:var(--err);min-height:24px;margin:4px 0 8px}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;background:var(--pine);color:#f3efe6;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header b{font-size:20px}
#out{background:none;color:#f3efe6;opacity:.8;padding:6px 10px;font-size:15px}
#list{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:9px 13px;border-radius:16px;background:var(--other);align-self:flex-start;border-end-start-radius:4px;word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--mine);color:var(--mine-ink);border-end-start-radius:16px;border-end-end-radius:4px}
.m small{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.m.me small{display:none}
.m time{display:block;font-size:11px;opacity:.6;margin-top:3px}
.m img.p{display:block;max-width:100%;border-radius:10px;margin:2px 0;cursor:zoom-in}
.m.st{background:none;padding:0;color:var(--muted)}
.m.st img.p{width:140px;height:auto;cursor:default}
.del{background:none;color:inherit;opacity:.65;font-size:12px;padding:2px 0 0;text-decoration:underline}
#empty{margin:auto;color:var(--muted)}
form{display:flex;align-items:center;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
#txt{margin:0;flex:1}
.tool{background:none;font-size:24px;padding:0 4px;color:var(--ink)}
#send{background:var(--mine);color:var(--mine-ink);padding:12px 18px;font-weight:700}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#lb img{max-width:95%;max-height:95%}
</style>
</head>
<body>
<section id="auth" class="hidden">
  <h1>شات العيلة</h1>
  <p>سجّل دخولك عشان تكلّم العيلة.</p>
  <input id="name" type="text" class="hidden" placeholder="اسمك (يظهر للعيلة)" autocomplete="nickname">
  <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" dir="ltr">
  <input id="pass" type="password" placeholder="كلمة السر (6 حروف على الأقل)" autocomplete="current-password" dir="ltr">
  <div id="err"></div>
  <button id="go">دخول</button>
  <button id="switch">معنديش حساب، سجّل حساب جديد</button>
</section>

<section id="app" class="hidden">
  <header><b>شات العيلة</b><button id="out">خروج</button></header>
  <div id="list"><div id="empty">مفيش رسايل لسه. ابدأ إنت. 👋</div></div>
  <form id="f">
    <button type="button" class="tool" id="picBtn" title="صورة">📷</button>
        <button type="button" class="tool" id="camBtn" title="كاميرا">📸</button>
    <button type="button" class="tool" id="stBtn" title="استيكر">😊</button>
    <input id="txt" type="text" placeholder="اكتب رسالة" autocomplete="off" maxlength="1900">
    <button id="send">إرسال</button>
  </form>
  <input id="pic" type="file" accept="image/*" class="hidden">
      <input id="cam" type="file" accept="image/*" capture="environment" class="hidden">
  <input id="st" type="file" accept="image/*" class="hidden">
</section>
<div id="lb" class="hidden"><img alt=""></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,deleteDoc,doc,query,orderBy,limit,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCiTdy28haNh_57OJGBaYwPS6HvJpBMJvI",
  authDomain: "family-chat-7de47.firebaseapp.com",
  projectId: "family-chat-7de47",
  storageBucket: "family-chat-7de47.firebasestorage.app",
  messagingSenderId: "810876639709",
  appId: "1:810876639709:web:0797f5e778b11437cfbe34"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let signup = false, unsub = null, first = true, forceScroll = false;

$("switch").onclick = () => {
  signup = !signup;
  $("name").classList.toggle("hidden", !signup);
  $("go").textContent = signup ? "سجّل حساب" : "دخول";
  $("switch").textContent = signup ? "عندي حساب، دخول" : "معنديش حساب، سجّل حساب جديد";
  $("pass").autocomplete = signup ? "new-password" : "current-password";
  $("err").textContent = "";
};

const errs = {
  "auth/invalid-email":"البريد الإلكتروني مش صح.",
  "auth/invalid-credential":"البريد أو كلمة السر غلط.",
  "auth/email-already-in-use":"البريد ده مسجّل قبل كده. جرّب الدخول.",
  "auth/weak-password":"كلمة السر ضعيفة. اكتب 6 حروف على الأقل.",
  "auth/network-request-failed":"مفيش إنترنت. جرّب تاني.",
  "auth/unauthorized-domain":"الموقع ده مش مضاف في Firebase (Authorized domains).",
  "auth/operation-not-allowed":"تسجيل الحسابات الجديدة مقفول."
};

$("go").onclick = async () => {
  $("err").textContent = "";
  const email = $("email").value.trim(), pass = $("pass").value, name = $("name").value.trim();
  if (signup && !name) { $("err").textContent = "اكتب اسمك."; return; }
  try {
    if (signup) {
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(c.user, {displayName: name});
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) { $("err").textContent = errs[e.code] || "حصلت مشكلة: " + e.code; }
};

$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  $("auth").classList.toggle("hidden", !!user);
  $("app").classList.toggle("hidden", !user);
  if (user) showApp(user);
});

$("lb").onclick = () => $("lb").classList.add("hidden");

function showApp(user) {
  first = true;
  const q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(40));
  unsub = onSnapshot(q, snap => {
    const list = $("list");
    const stick = first || forceScroll || (list.scrollHeight - list.scrollTop - list.clientHeight < 150);
    first = false; forceScroll = false;
    list.innerHTML = "";
    const docs = snap.docs.map(d => ({id: d.id, ...d.data()})).reverse();
    if (!docs.length) list.innerHTML = '<div id="empty">مفيش رسايل لسه. ابدأ إنت. 👋</div>';
    for (const m of docs) {
      const mine = m.uid === user.uid;
      const el = document.createElement("div");
      el.className = "m" + (mine ? " me" : "") + (m.sticker ? " st" : "");
      const s = document.createElement("small"); s.textContent = m.name || "";
      el.append(s);
      if (m.image) {
        const im = document.createElement("img");
        im.className = "p"; im.src = m.image; im.alt = "";
        if (!m.sticker) im.onclick = () => { $("lb").querySelector("img").src = m.image; $("lb").classList.remove("hidden"); };
        if (stick) im.onload = () => { list.scrollTop = list.scrollHeight; };
        el.append(im);
      }
      if (m.text) { const t = document.createElement("span"); t.textContent = m.text; el.append(t); }
      const tm = document.createElement("time");
      if (m.createdAt) tm.textContent = m.createdAt.toDate().toLocaleTimeString("ar-EG", {hour:"2-digit", minute:"2-digit"});
      el.append(tm);
      if (mine) {
        const d = document.createElement("button");
        d.className = "del"; d.textContent = "مسح";
        d.onclick = () => {
          if (confirm("تمسح الرسالة دي؟"))
            deleteDoc(doc(db, "messages", m.id)).catch(e => alert("ما اتمسحتش: " + e.code));
        };
        el.append(d);
      }
      list.append(el);
    }
    if (stick) list.scrollTop = list.scrollHeight;
  }, e => { $("list").textContent = "مش قادر أقرا الرسايل: " + e.code; });
}

async function sendDoc(extra) {
  const u = auth.currentUser;
  if (!u) return;
  forceScroll = true;
  try {
    await addDoc(collection(db, "messages"), {uid: u.uid, name: u.displayName || "مجهول", text: "", createdAt: serverTimestamp(), ...extra});
  } catch (e) { alert("الرسالة ما اتبعتتش: " + e.code); }
}

$("f").onsubmit = e => {
  e.preventDefault();
  const text = $("txt").value.trim();
  if (!text) return;
  $("txt").value = "";
  sendDoc({text});
};

function loadImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), i = new Image();
    i.onload = () => { URL.revokeObjectURL(url); res(i); };
    i.onerror = () => rej(new Error("bad"));
    i.src = url;
  });
}

async function shrink(file, max, type) {
  const img = await loadImg(file);
  let s = Math.min(1, max / Math.max(img.width, img.height)), q = 0.7;
  for (let n = 0; n < 6; n++) {
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.width * s));
    c.height = Math.max(1, Math.round(img.height * s));
    const x = c.getContext("2d");
    if (type === "image/jpeg") { x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); }
    x.drawImage(img, 0, 0, c.width, c.height);
    const out = c.toDataURL(type, q);
    if (out.length < 600000) return out;
    s *= 0.75; q = Math.max(0.4, q - 0.1);
  }
  throw new Error("big");
}

$("picBtn").onclick = () => $("pic").click();
  $("camBtn").onclick = () => $("cam").click();
$("stBtn").onclick = () => $("st").click();

$("pic").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try { sendDoc({image: await shrink(f, 900, "image/jpeg")}); }
  catch { alert("الصورة دي ما اتبعتتش. جرّب صورة تانية."); }
};

$("st").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try { sendDoc({image: await shrink(f, 320, "image/webp"), sticker: true}); }
  catch { alert("الاستيكر ده ما اتبعتش. جرّب تاني."); }
};
</script>
</body>
</html>
